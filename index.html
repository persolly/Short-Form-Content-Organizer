<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reel Vault - Dashboard</title>
    <!-- Link to our external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">

    <!-- LEFT SIDEBAR -->
    <aside id="sidebar-navigation">
        <h1>
            <span class="icon" style="color: var(--accent-blue);">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><path d="M12 11h.01"></path></svg>
            </span>
            Reel Vault
        </h1>
        
        <!-- Navigation Tabs -->
        <nav class="nav-tabs">
            <a href="index.html" class="nav-item active" id="tab-dashboard">
                <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></span>
                Dashboard
            </a>
            <a href="instagram.html" class="nav-item" id="tab-instagram">
                <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></span>
                Instagram Reels
            </a>
            <a href="tiktok.html" class="nav-item" id="tab-tiktok">
                <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path></svg></span>
                TikToks
            </a>
            <a href="youtube.html" class="nav-item" id="tab-youtube">
                <span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg></span>
                YouTube Shorts
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main id="main-content-area">
        
        <div class="dashboard-container">
            <!-- HEADER -->
            <header class="dashboard-header">
                <h1 class="dashboard-title">Welcome back to Reel Vault! 🚀</h1>
                <p class="dashboard-subtitle">Organize and preview your favorite short-form videos in one clean space.</p>
            </header>

            <!-- STATS GRID -->
            <section class="stats-grid">
                <div class="stat-card" onclick="window.location.href='index.html'">
                    <div class="stat-icon total"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><path d="M12 11h.01"></path></svg></span></div>
                    <div class="stat-info">
                        <h3 id="stat-total-count">0</h3>
                        <p>Total Saves</p>
                    </div>
                </div>
                <div class="stat-card" style="cursor: pointer;" onclick="window.location.href='instagram.html'">
                    <div class="stat-icon instagram"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></span></div>
                    <div class="stat-info">
                        <h3 id="stat-instagram-count">0</h3>
                        <p>Instagram Reels</p>
                    </div>
                </div>
                <div class="stat-card" style="cursor: pointer;" onclick="window.location.href='tiktok.html'">
                    <div class="stat-icon tiktok"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path></svg></span></div>
                    <div class="stat-info">
                        <h3 id="stat-tiktok-count">0</h3>
                        <p>TikToks</p>
                    </div>
                </div>
                <div class="stat-card" style="cursor: pointer;" onclick="window.location.href='youtube.html'">
                    <div class="stat-icon youtube"><span class="icon"><svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.33 29 29 0 0 0-.46-5.33z"></path><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon></svg></span></div>
                    <div class="stat-info">
                        <h3 id="stat-youtube-count">0</h3>
                        <p>YouTube Shorts</p>
                    </div>
                </div>
            </section>

            <!-- QUICK SAVE CARD -->
            <section class="quick-save-card">
                <h3>⚡ Quick Add Video</h3>
                <div class="quick-save-form">
                    <input type="text" id="input-video-url" placeholder="Paste any Instagram Reel, TikTok, or YouTube Shorts URL here...">
                    <select id="select-target-folder">
                        <option value="">Uncategorized</option>
                        <!-- JS will inject folder options here -->
                    </select>
                    <button id="action-save-video" class="btn btn-primary">Save Video</button>
                </div>
            </section>

            <!-- RECENT SAVES SECTION -->
            <section>
                <div class="section-header">
                    <h2 id="recent-saves-title">Recent Saves</h2>
                </div>
                
                <div id="video-grid-container" style="padding: 0;">
                    <div id="video-grid">
                        <!-- JS will inject recent cards here -->
                    </div>
                </div>
            </section>
        </div>

    </main>

    <!-- Modal Overlay -->
    <div id="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title">Input</h3>
            <input type="text" id="modal-input" class="modal-input" placeholder="Enter value...">
            <div class="modal-actions">
                <button onclick="closeModal()" class="btn">Cancel</button>
                <button id="modal-confirm-btn" class="btn btn-primary">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Link to our external Javascript file -->
    <script src="script.js"></script>
</body>
</html>
